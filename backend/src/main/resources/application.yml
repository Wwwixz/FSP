server:
  port: ${PORT:8080}
  # Сжатие ответов — критично для медленных публичных туннелей
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: docgen-backend
  servlet:
    multipart:
      max-file-size: 10MB
  mail:
    # Отправка документов по почте: MAIL_USERNAME + MAIL_PASSWORD в backend/.env.
    # По умолчанию Mail.ru; для Яндекса: MAIL_HOST=smtp.yandex.ru
    host: ${MAIL_HOST:smtp.mail.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000

app:
  cors:
    # Список разрешённых источников; "*" разрешает все (MVP/демо)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  documents:
    # Сколько сессий документов хранится в памяти (защита от переполнения)
    max-sessions: 200
    session-ttl-minutes: 240
    # Имя организации, подставляемое в верхний колонтитул шаблона A,
    # если его не удалось определить из черновика
    default-organization: ""

# --- Настройки ИИ -------------------------------------------------------
# AI_PROVIDER:
#   mock      — встроенный детерминированный провайдер (работает без ключей,
#               подходит для демонстрации и проверки офлайн-сценариев);
#   openai    — любой OpenAI-совместимый API, ключ AI_API_KEY;
#   gigachat  — GigaChat (Сбер), OpenAI-совместимый API, двухступенчатая
#               OAuth2 авторизация через AI_GIGACHAT_AUTH_KEY.
#               Токен обновляется автоматически. При сертификатах НУЦ
#               Минцифры на локальной разработке включить AI_GIGACHAT_INSECURE_SSL=true.
ai:
  provider: ${AI_PROVIDER:mock}
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  model: ${AI_MODEL:gpt-4o-mini}
  timeout-ms: ${AI_TIMEOUT_MS:60000}
  # Просить ли у API строгий JSON-режим (response_format=json_object).
  # Для локальных моделей иногда нужно выключить.
  json-mode: ${AI_JSON_MODE:true}
  # Имитировать недоступность ИИ (для демонстрации сценария 6 ТЗ)
  simulate-failure: ${AI_SIMULATE_FAILURE:false}
  # --- Провайдер GigaChat (Сбер) ---
  gigachat-auth-key: ${AI_GIGACHAT_AUTH_KEY:}
  gigachat-scope: ${AI_GIGACHAT_SCOPE:GIGACHAT_API_PERS}
  gigachat-oauth-url: ${AI_GIGACHAT_OAUTH_URL:https://ngw.devices.sberbank.ru:9443/api/v2/oauth}
  gigachat-base-url: ${AI_GIGACHAT_BASE_URL:https://api.giga.chat}
  gigachat-model: ${AI_GIGACHAT_MODEL:GigaChat-2}
  gigachat-insecure-ssl: ${AI_GIGACHAT_INSECURE_SSL:false}

logging:
  level:
    ru.docgen: INFO
