# Render.com Blueprint — DocHelper (бэкенд + фронт в одном контейнере).
# Деплой: https://dashboard.render.com/select-repo?type=blueprint → выбрать репозиторий FSP → Apply.
services:
  - type: web
    name: dochelper
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: gigachat
      - key: AI_GIGACHAT_SCOPE
        value: GIGACHAT_API_PERS
      - key: AI_GIGACHAT_INSECURE_SSL
        value: "true"
      # Ключ GigaChat из backend/.env — впиши значение в дашборде Render
      # (Environment → AI_GIGACHAT_AUTH_KEY) после создания сервиса.
      - key: AI_GIGACHAT_AUTH_KEY
        sync: false
